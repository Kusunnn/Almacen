<div class="app-layout" [class.has-sidebar]="showSidebar()">
  <app-sidebar *ngIf="showSidebar()"></app-sidebar>
  <main class="app-content" [class.sidebar-visible]="showSidebar()" [class.sidebar-collapsed]="showSidebar() && sidebarState.isCollapsed()">
    <router-outlet></router-outlet>
  </main>
</div>
